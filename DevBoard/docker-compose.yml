version: '3.8'

services:
  # Node.js Express API Service
  api:
    build: ./backend
    container_name: devboard_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/devboard
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=devboard_jwt_access_secret_key_2026_cse_portfolio_jwt_dev_only
      - JWT_REFRESH_SECRET=devboard_jwt_refresh_secret_key_2026_cse_portfolio_jwt_dev_only
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - FRONTEND_URL=http://localhost:80
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devboard_net

  # MongoDB Service
  mongodb:
    image: mongo:6.0
    container_name: devboard_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devboard_net

  # Redis Caching Service
  redis:
    image: redis:7-alpine
    container_name: devboard_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devboard_net

# Persistence Volumes
volumes:
  mongodb_data:
  redis_data:

# Networks Setup
networks:
  devboard_net:
    driver: bridge
